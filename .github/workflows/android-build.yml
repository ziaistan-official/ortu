name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26.3
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build SvelteKit Frontend
        run: npm run build

      - name: Compile Rust C dynamic library for Android (aarch64)
        run: |
          export PATH=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CC_aarch64_linux_android=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

          cargo build --package Ortu --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --features tauri/custom-protocol --lib --release
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cp src-tauri/target/aarch64-linux-android/release/libortu_lib.so src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libortu.so

      - name: Build Android APK with Gradle
        run: |
          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew assembleArm64Debug -x rustBuildArm64Debug -x rustBuildArm64Release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ortu-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
